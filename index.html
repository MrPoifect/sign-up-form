<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt A Server</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="image-container">
            <div class="logo-bg">
                <p class="logo">ADOPT A SERVER</p>
            </div>
            <img src="images/datacentermed.jpg" alt="An image of a data center">
                <p class="attribution">Photo by <a href="https://unsplash.com/@matthieu_cabri?utm_source=
                unsplash&utm_medium=referral&utm_content=creditCopyText">Matthieu Beaumont
                </a> on <a href="https://unsplash.com/photos/a-very-large-array-of-electronic-
                equipment-in-a-room-iYnpYeyu57k?utm_source=unsplash&utm_medium=referral&utm_
                content=creditCopyText">Unsplash</a></p>
        </div>
        <div class="form-container">
            <div class="description">
                <h1 class="description-header">
                    Save our data centers</h1>
                <p class="description-text">
                    Support a data center by adopting a server
                    today! You will receive a monthly newsletter telling you 
                    how your donation has helped your adopted server.
                </p>
                <p class="description-text">Sign up today!</p>
                <div class="feilds-container">
                    <form action="" method="get" class="adop-form" >
                        <div class="form-row">
                            <label for="first-name">FIRST NAME</label>
                            <input id="first-name" name="first-name" type="text" required/>
                            <label for="last-name">LAST NAME</label>
                            <input id="last-name" name="last-name" type="text"/>
                        </div>
                        <div class="form-row-main">
                            <label for="email">EMAIL</label>
                            <input id="email" name="email" type="email" required/>
                            <label for="phone-number">PHONE NUMBER</label>
                            <input id="phone-number" name="phone-number" type="number"/>
                        </div>
                        <div class="form-row">
                            <label for="password">PASSWORD</label>
                            <input id="password" name="password" type="password" required/>
                            <label for="passwordconf">CONFIRM PASSWORD</label>
                            <input id="passwordconf" name="passwordconf" type="password" required/>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

      
</body>
</html>
